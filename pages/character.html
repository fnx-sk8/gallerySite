<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fenix Character Design</title>
    <link rel="stylesheet" href="../style.css">

    <style>
        body {
            background-image: url("../images/blackTexture.png");

        }

        .gallery-wrapper {
            display: flex;
            justify-content: center;
            padding: 20px;
            width: 100%;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            grid-gap: 15px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .gallery-item {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 60vh;
            overflow: hidden;
            aspect-ratio: 4/3;
        }

        .gallery-item img,
        .gallery-item video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border: 5px solid gray;
            box-sizing: border-box;
        }



        /* Mobile Optimization */
        @media only screen and (max-width: 600px) {
            .gallery {
                grid-template-columns: 1fr;


            }

            .gallery-item {
                height: 50vh;
            }
        }

        @media (max-width: 480px) {
            .gallery-item {
                height: 40vh;
            }
        }
    </style>
</head>

<body>
    <nav>
        <ul>
            <li><a href="../index.html">Home</a></li>
            <li><a href="./photo.html">Photo</a></li>
            <li><a href="./lighting.html">Lighting</a></li>
            <li><a href="#">Character</a></li>
        </ul>
    </nav>

    <h1>Character Design</h1>

    <div class="gallery-wrapper">
        <div class="gallery">
            <div class="gallery-item">
                <img src="../images/characterBruno.png" alt="Character Bruno">
            </div>
            <div class="gallery-item">
                <video src="../videos/bruno_1.mp4" autoplay loop muted></video>
            </div>
            <div class="gallery-item">
                <video src="../videos/winkle.mp4" autoplay loop muted></video>
            </div>
            <div class="gallery-item">
                <img src="../images/characterWinkle.png" alt="Character Winkle">
            </div>
            <div class="gallery-item">
                <img src="../images/chracterOctavio.png" alt="Character Octavio">
            </div>
            <div class="gallery-item">
                <video src="../videos/octo.mp4" autoplay loop muted></video>
            </div>
        </div>
    </div>

    <nav>
        <ul>
            <li><a href="../index.html">Home</a></li>
            <li><a href="./photo.html">Photo</a></li>
            <li><a href="./lighting.html">Lighting</a></li>
            <li><a href="#">Character</a></li>
        </ul>
    </nav>

    <footer>
        <p>&copy; 2024 Fenix Character Design</p>
    </footer>
</body>

</html>
